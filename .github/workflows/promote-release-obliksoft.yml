name: Promote beta release to stable (OblikSoft)

# Push a tag named promote-<beta-tag> (for example promote-obliksoft-v1.1.0-beta1) to publish
# the SAME binaries of that pre-release as the stable release obliksoft-v1.1.0 (no rebuild).
on:
  push:
    tags:
      - "promote-*"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Promote
        shell: bash
        run: |
          set -o pipefail
          {
            set -ex
            SRC="${GITHUB_REF_NAME#promote-}"
            DST="${SRC%-beta*}"
            if [ "$SRC" = "$DST" ]; then echo "$SRC is not a beta tag"; exit 1; fi
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SRC" --jq .sha)
            mkdir dl && cd dl
            gh release download "$SRC" --repo "$GITHUB_REPOSITORY"
            ls -l
            test "$(ls *.exe | wc -l)" -ge 4
            sha256sum *.exe > SHA256SUMS.txt
            cat SHA256SUMS.txt
            # Create the stable tag first (pushes made with GITHUB_TOKEN do not start other workflows)
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "$DST" "$SHA"
            git push origin "refs/tags/$DST"
            gh release create "$DST" --repo "$GITHUB_REPOSITORY" --title "$DST" \
              --notes "Stable release. Binaries are byte-identical to the tested pre-release $SRC (no rebuild). SHA-256 sums are attached." \
              *.exe SHA256SUMS.txt
            gh release view "$DST" --repo "$GITHUB_REPOSITORY" --json assets,isPrerelease --jq '{pre: .isPrerelease, assets: [.assets[].name]}'
          } 2>&1 | tee /tmp/promote.log

      - name: Show errors
        if: failure()
        run: |
          tail -n 25 /tmp/promote.log | cut -c1-200 | python3 -c "import sys;t=sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A');print('::error title=promote log::'+t)"
